<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taller de Acentuación Ortográfica</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f7f9fa;
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 750px;
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }

        .screen {
            display: none;
        }

        .screen.active {
            display: block;
        }

        h1, h2 {
            color: #2c3e50;
            text-align: center;
        }

        .description {
            text-align: center;
            color: #7f8c8d;
            margin-bottom: 25px;
        }

        .input-group {
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        input[type="text"] {
            padding: 12px;
            border: 1px solid #dcdde1;
            border-radius: 8px;
            font-size: 16px;
            outline: none;
            transition: border 0.2s;
        }

        input[type="text"]:focus {
            border-color: #3498db;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.2s, transform 0.1s;
        }

        button:active {
            transform: scale(0.98);
        }

        .btn-green {
            background-color: #2ecc71;
            color: white;
        }

        .btn-green:hover {
            background-color: #27ae60;
        }

        .btn-secondary {
            background-color: #95a5a6;
            color: white;
        }

        .btn-secondary:hover {
            background-color: #7f8c8d;
        }

        .header-game {
            display: flex;
            justify-content: space-between;
            padding: 12px 15px;
            background: #f1f2f6;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .sega-table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
            border-radius: 8px;
            overflow: hidden;
        }

        .sega-table th, .sega-table td {
            border: 1px solid #dfe4ea;
            padding: 14px;
            text-align: center;
        }

        .sega-table th {
            background-color: #34495e;
            color: white;
            font-size: 15px;
        }

        .sega-table td {
            height: 45px;
            cursor: pointer;
            font-size: 18px;
            transition: background 0.15s;
        }

        .sega-table td:hover {
            background-color: #f1f2f6;
        }

        .sega-table td.selected {
            background-color: #e8f8f5;
            border: 2px solid #2ecc71;
            font-weight: bold;
            color: #27ae60;
        }

        .leaderboard-list {
            list-style: none;
            padding: 0;
            margin: 15px 0;
        }

        .leaderboard-item {
            display: flex;
            justify-content: space-between;
            padding: 12px 15px;
            border-bottom: 1px solid #f1f2f6;
            background: #fafbfc;
            margin-bottom: 6px;
            border-radius: 6px;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- PANTALLA INICIAL -->
    <div id="screen-welcome" class="screen active">
        <h1>Taller de Acentuación Ortográfica</h1>
        <p class="description">Evaluación interactiva de acentuación y clasificación de palabras.</p>
        
        <div class="input-group">
            <label for="user-name"><b>Nombre Completo del Estudiante:</b></label>
            <input type="text" id="user-name" placeholder="Ej. Diego Castro" autocomplete="off">
        </div>

        <button class="btn-green" onclick="startGame()">Comenzar Evaluación</button>
        <button class="btn-secondary" onclick="loadLeaderboard()">Ver Tabla de Posiciones General</button>
    </div>

    <!-- PANTALLA DEL EXAMEN -->
    <div id="screen-game" class="screen">
        <div class="header-game">
            <span>Estudiante: <b id="player-display"></b></span>
            <span>Palabra: <b id="current-index">1</b> / 10</span>
            <span>Aciertos: <b id="score-display">0</b></span>
        </div>

        <h2 id="word-display" style="text-align: center; letter-spacing: 3px; font-size: 28px; margin: 20px 0;">---</h2>

        <!-- Tabla SEGA (5 columnas) -->
        <table class="sega-table">
            <thead>
                <tr>
                    <th>Anterior</th>
                    <th>Sobresdrújula</th>
                    <th>Esdrújula</th>
                    <th>Grave</th>
                    <th>Aguda</th>
                </tr>
            </thead>
            <tbody>
                <tr id="syllables-row">
                    <td>-</td>
                    <td>-</td>
                    <td>-</td>
                    <td>-</td>
                    <td>-</td>
                </tr>
            </tbody>
        </table>

        <div id="step1-info" style="margin-top: 15px; font-weight: bold; color: #2980b9; min-height: 24px;"></div>

        <button class="btn-green" onclick="handleNextStep()" style="margin-top: 20px;">Siguiente</button>
    </div>

    <!-- PANTALLA DE RESULTADOS -->
    <div id="screen-results" class="screen">
        <h2>Resultados de la Evaluación</h2>
        <p id="result-name" style="text-align: center; font-size: 18px; font-weight: bold; margin-top: 15px;"></p>
        <p id="result-grade" style="text-align: center; font-size: 24px; color: #27ae60; margin: 15px 0;"></p>
        <div id="result-user-container" style="margin: 20px 0;"></div>
        <button class="btn-green" onclick="loadLeaderboard()">Ver Tabla de Posiciones</button>
        <button class="btn-secondary" onclick="showWelcomeScreen()">Volver al Inicio</button>
    </div>

    <!-- PANTALLA DE TABLA DE POSICIONES -->
    <div id="screen-leaderboard" class="screen">
        <h2>Tabla de Posiciones General</h2>
        <ul id="leaderboard-body" class="leaderboard-list">
            <!-- Cargado dinámicamente -->
        </ul>
        <button class="btn-secondary" onclick="showWelcomeScreen()">Volver al Inicio</button>
    </div>
</div>

<!-- FIREBASE DB (SDK CDN Version 8.10.1) -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyD6au5DwvcsJqd-AVZHg2VrigBK3rcw39s",
        authDomain: "acento-ortografico.firebaseapp.com",
        databaseURL: "https://acento-ortografico-default-rtdb.firebaseio.com",
        projectId: "acento-ortografico",
        storageBucket: "acento-ortografico.appspot.com",
        messagingSenderId: "992822183733",
        appId: "1:992822183733:web:472513a0bdd187a19a6e7c"
    };

    let database = null;
    try {
        firebase.initializeApp(firebaseConfig);
        database = firebase.database();
    } catch(e) {
        console.warn("Modo local activado.", e);
    }

    const wordBank = [
        { syllables: ["dí", "ga", "se", "lo"], category: "Sobresdrújula" },
        { syllables: ["cóm", "pra", "te", "lo"], category: "Sobresdrújula" },
        { syllables: ["plá", "ta", "no"], category: "Esdrújula" },
        { syllables: ["mú", "si", "ca"], category: "Esdrújula" },
        { syllables: ["ár", "bol"], category: "Grave" },
        { syllables: ["lá", "piz"], category: "Grave" },
        { syllables: ["ca", "sa"], category: "Grave" },
        { syllables: ["pe", "rro"], category: "Grave" },
        { syllables: ["ca", "fé"], category: "Aguda" },
        { syllables: ["ra", "tón"], category: "Aguda" },
        { syllables: ["ex", "cé", "tri", "co"], category: "Esdrújula" },
        { syllables: ["mé", "di", "co"], category: "Esdrújula" }
    ];

    let currentStudent = "";
    let correctAnswersCount = 0;
    let currentWordIndex = 0;
    let selectedWords = [];
    let userSelectedSyllable = -1;
    let isShowingFeedback = false;

    function startGame() {
        const nameInput = document.getElementById("user-name").value.trim();
        if (!nameInput) {
            alert("Por favor ingresa tu nombre completo antes de comenzar.");
            return;
        }

        currentStudent = nameInput;
        correctAnswersCount = 0;
        currentWordIndex = 0;
        selectedWords = [...wordBank].sort(() => 0.5 - Math.random()).slice(0, 10);

        document.getElementById("player-display").textContent = currentStudent;
        document.getElementById("score-display").textContent = correctAnswersCount;

        switchScreen("screen-game");
        loadQuestion();
    }

    function loadQuestion() {
        if (currentWordIndex >= selectedWords.length) {
            finishGame();
            return;
        }

        isShowingFeedback = false;
        userSelectedSyllable = -1;
        document.getElementById("step1-info").innerText = "";

        const q = selectedWords[currentWordIndex];
        document.getElementById("current-index").textContent = currentWordIndex + 1;
        document.getElementById("word-display").textContent = q.syllables.join("");

        const row = document.getElementById("syllables-row");
        const cells = ["", "", "", "", ""];
        
        for (let i = 0; i < q.syllables.length; i++) {
            const pos = 4 - i;
            if (pos >= 0) {
                cells[pos] = q.syllables[q.syllables.length - 1 - i];
            }
        }

        row.innerHTML = cells.map((c, index) => `<td onclick="selectSyllable(${index})">${c || "-"}</td>`).join("");
    }

    function selectSyllable(index) {
        if (isShowingFeedback) return;
        userSelectedSyllable = index;
        
        const tdCells = document.querySelectorAll("#syllables-row td");
        tdCells.forEach((td, idx) => {
            if (idx === index && td.innerText !== "-") {
                td.classList.add("selected");
            } else {
                td.classList.remove("selected");
            }
        });

        const categoryNames = { 4: "Aguda", 3: "Grave", 2: "Esdrújula", 1: "Sobresdrújula", 0: "Anterior" };
        const colName = categoryNames[index] || "--";
        document.getElementById("step1-info").innerText = `Has ubicado la sílaba tónica en la columna: ${colName}.`;
    }

    function handleNextStep() {
        if (isShowingFeedback) {
            currentWordIndex++;
            if (currentWordIndex < selectedWords.length) {
                loadQuestion();
            } else {
                finishGame();
            }
            return;
        }

        if (userSelectedSyllable === -1) {
            alert("Por favor selecciona la sílaba tónica en el cuadro SEGA.");
            return;
        }

        isShowingFeedback = true;
        const q = selectedWords[currentWordIndex];
        
        const categoryMap = { 4: "Aguda", 3: "Grave", 2: "Esdrújula", 1: "Sobresdrújula" };
        const userCategory = categoryMap[userSelectedSyllable];

        if (userCategory === q.category) {
            correctAnswersCount++;
            document.getElementById("score-display").textContent = correctAnswersCount;
            document.getElementById("step1-info").innerHTML = "¡Excelente! Todo correcto.";
        } else {
            document.getElementById("step1-info").innerHTML = `Clasificación errónea: Elegiste ${userCategory}, pero la palabra es ${q.category}.`;
        }
    }

    function finishGame() {
        const finalGrade = parseFloat((correctAnswersCount * 1).toFixed(1));
        switchScreen("screen-results");

        document.getElementById("result-name").innerText = `Estudiante: ${currentStudent}`;
        document.getElementById("result-grade").innerText = `Calificación Final: ${finalGrade} / 10`;

        const record = { name: currentStudent, grade: finalGrade, score: correctAnswersCount, timestamp: Date.now() };

        if (database) {
            database.ref("leaderboard").push(record).then(() => {
                console.log("Puntaje guardado en Firebase.");
            }).catch(() => {
                saveLeaderboardLocal(record);
            });
        } else {
            saveLeaderboardLocal(record);
        }
    }

    function saveLeaderboardLocal(record) {
        let localLeaderboard = JSON.parse(localStorage.getItem("leaderboard_acento") || "[]");
        localLeaderboard.push(record);
        localStorage.setItem("leaderboard_acento", JSON.stringify(localLeaderboard));
    }

    function loadLeaderboard() {
        switchScreen("screen-leaderboard");
        const tbody = document.getElementById("leaderboard-body");
        tbody.innerHTML = "<li>Cargando puntajes...</li>";

        if (database) {
            database.ref("leaderboard").once("value").then((snapshot) => {
                let leaderboard = [];
                snapshot.forEach(child => {
                    leaderboard.push(child.val());
                });
                renderLeaderboardTable(leaderboard);
            }).catch(() => {
                loadLeaderboardFromLocal();
            });
        } else {
            loadLeaderboardFromLocal();
        }
    }

    function loadLeaderboardFromLocal() {
        let localLeaderboard = JSON.parse(localStorage.getItem("leaderboard_acento") || "[]");
        renderLeaderboardTable(localLeaderboard);
    }

    function renderLeaderboardTable(leaderboard) {
        const tbody = document.getElementById("leaderboard-body");
        leaderboard.sort((a, b) => b.score - a.score);

        if (leaderboard.length === 0) {
            tbody.innerHTML = "<li>No hay puntajes registrados aún.</li>";
            return;
        }

        tbody.innerHTML = leaderboard.map(item => `
            <li class="leaderboard-item">
                <span><b>${item.name}</b></span>
                <span>${item.score} aciertos (${item.grade} pts)</span>
            </li>
        `).join("");
    }

    function switchScreen(screenId) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(screenId).classList.add('active');
    }

    function showWelcomeScreen() {
        switchScreen("screen-welcome");
    }
</script>

</body>
</html>
