<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juego del Acento Ortográfico</title>
    <style>
        :root {
            --primary: #4338ca;
            --primary-hover: #3730a3;
            --bg: #f8fafc;
            --card: #ffffff;
            --text: #1e293b;
            --correct: #16a34a;
            --wrong: #dc2626;
            --border: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background-color: var(--card);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1), 0 8px 10px -6px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 600px;
        }

        h1, h2 {
            text-align: center;
            color: var(--primary);
            margin-bottom: 20px;
        }

        p.description {
            text-align: center;
            color: #64748b;
            margin-bottom: 24px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid var(--border);
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: var(--primary);
        }

        button {
            width: 100%;
            padding: 12px 20px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        button:active {
            transform: scale(0.98);
        }

        .header-game {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 2px solid var(--border);
            font-weight: 600;
        }

        .word-display {
            font-size: 36px;
            font-weight: 800;
            text-align: center;
            letter-spacing: 2px;
            margin: 30px 0;
            color: var(--primary);
        }

        .options-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }

        .option-btn {
            background-color: #f1f5f9;
            color: var(--text);
            border: 2px solid var(--border);
            padding: 14px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
        }

        .option-btn:hover {
            background-color: #e2e8f0;
        }

        .option-btn.correct {
            background-color: var(--correct) !important;
            color: white !important;
            border-color: var(--correct) !important;
        }

        .option-btn.wrong {
            background-color: var(--wrong) !important;
            color: white !important;
            border-color: var(--wrong) !important;
        }

        .feedback {
            text-align: center;
            font-weight: 600;
            min-height: 24px;
            margin-bottom: 16px;
        }

        .feedback.correct-text {
            color: var(--correct);
        }

        .feedback.wrong-text {
            color: var(--wrong);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            padding: 10px;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }

        th {
            background-color: #f1f5f9;
            color: var(--primary);
        }

        .highlight-user {
            background-color: #e0e7ff;
            font-weight: bold;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- PANTALLA INICIAL -->
        <div id="screen-welcome">
            <h1>Acento Ortográfico</h1>
            <p class="description">Selecciona la clasificación correcta para cada palabra.</p>
            <div class="input-group">
                <label for="app-user-name">Ingresa tu Nombre Completo:</label>
                <input type="text" id="app-user-name" placeholder="Ej. Juan Pérez" autocomplete="off">
            </div>
            <button onclick="startGame()">Iniciar Juego</button>
        </div>

        <!-- PANTALLA DEL JUEGO -->
        <div id="screen-game" class="hidden">
            <div class="header-game">
                <span id="player-display"></span>
                <span>Palabra: <span id="current-index">1</span>/10</span>
            </div>
            <div class="word-display" id="word-target">CÁMARA</div>
            <div class="options-grid">
                <button class="option-btn" onclick="checkAnswer('Aguda')">Aguda</button>
                <button class="option-btn" onclick="checkAnswer('Grave')">Grave</button>
                <button class="option-btn" onclick="checkAnswer('Esdrújula')">Esdrújula</button>
                <button class="option-btn" onclick="checkAnswer('Sobresdrújula')">Sobresdrújula</button>
            </div>
            <div class="feedback" id="feedback-message"></div>
            <button id="btn-next" class="hidden" onclick="nextQuestion()">Siguiente Palabra</button>
        </div>

        <!-- PANTALLA DE RESULTADOS -->
        <div id="screen-results" class="hidden">
            <h2>Resultados</h2>
            <p style="text-align: center; font-size: 18px; margin-bottom: 10px;">
                Estudiante: <b id="result-name"></b>
            </p>
            <p style="text-align: center; font-size: 20px; font-weight: bold; color: var(--primary); margin-bottom: 20px;">
                Calificación Final: <span id="result-grade">0.0</span> / 5.0
            </p>
            
            <h3>Tabla de Posiciones</h3>
            <table>
                <thead>
                    <tr>
                        <th>Pos.</th>
                        <th>Nombre</th>
                        <th>Nota</th>
                        <th>Aciertos</th>
                    </tr>
                </thead>
                <tbody id="leaderboard-body">
                </tbody>
            </table>
            <br>
            <button onclick="restartActivity()">Volver a Jugar</button>
        </div>
    </div>

    <!-- FIREBASE SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        // Configuración de Firebase Realtime Database
        const firebaseConfig = {
            databaseURL: "https://acento-ortografico-8ed2d-default-rtdb.firebaseio.com/"
        };
        
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        // Banco de palabras
        const wordBank = [
            { word: "CANCION", category: "Aguda" },
            { word: "ARBOL", category: "Grave" },
            { word: "CAMARA", category: "Esdrújula" },
            { word: "DIGASELO", category: "Sobresdrújula" },
            { word: "CAFE", category: "Aguda" },
            { word: "LAPIZ", category: "Grave" },
            { word: "MUSICA", category: "Esdrújula" },
            { word: "ENTREGASELO", category: "Sobresdrújula" },
            { word: "CORAZON", category: "Aguda" },
            { word: "MESA", category: "Grave" }
        ];

        let currentStudent = "";
        let currentWordIndex = 0;
        let correctAnswersCount = 0;
        let selectedWords = [];

        function startGame() {
            const nameInput = document.getElementById("app-user-name").value.trim();
            if (!nameInput) {
                alert("Por favor, ingresa tu nombre para comenzar.");
                return;
            }
            currentStudent = nameInput;
            document.getElementById("player-display").innerText = currentStudent;

            // Seleccionar 10 palabras al azar
            selectedWords = [...wordBank].sort(() => 0.5 - Math.random()).slice(0, 10);
            currentWordIndex = 0;
            correctAnswersCount = 0;

            document.getElementById("screen-welcome").classList.add("hidden");
            document.getElementById("screen-game").classList.remove("hidden");
            document.getElementById("screen-results").classList.add("hidden");

            showWord();
        }

        function showWord() {
            document.getElementById("feedback-message").innerText = "";
            document.getElementById("feedback-message").className = "feedback";
            document.getElementById("btn-next").classList.add("hidden");
            
            const buttons = document.querySelectorAll(".option-btn");
            buttons.forEach(btn => {
                btn.disabled = false;
                btn.classList.remove("correct", "wrong");
            });

            document.getElementById("current-index").innerText = currentWordIndex + 1;
            document.getElementById("word-target").innerText = selectedWords[currentWordIndex].word;
        }

        function checkAnswer(userChoice) {
            const currentItem = selectedWords[currentWordIndex];
            const buttons = document.querySelectorAll(".option-btn");
            const feedbackEl = document.getElementById("feedback-message");

            buttons.forEach(btn => btn.disabled = true);

            if (userChoice === currentItem.category) {
                correctAnswersCount++;
                feedbackEl.innerText = "¡Correcto!";
                feedbackEl.className = "feedback correct-text";
            } else {
                feedbackEl.innerText = `Incorrecto. Era ${currentItem.category}.`;
                feedbackEl.className = "feedback wrong-text";
            }

            buttons.forEach(btn => {
                if (btn.innerText === currentItem.category) {
                    btn.classList.add("correct");
                } else if (btn.innerText === userChoice && userChoice !== currentItem.category) {
                    btn.classList.add("wrong");
                }
            });

            document.getElementById("btn-next").classList.remove("hidden");
        }

        function nextQuestion() {
            currentWordIndex++;
            if (currentWordIndex < selectedWords.length) {
                showWord();
            } else {
                finishGame();
            }
        }

        function finishGame() {
            const finalGrade = parseFloat((correctAnswersCount * 0.5).toFixed(1));

            document.getElementById("screen-game").classList.add("hidden");
            document.getElementById("screen-results").classList.remove("hidden");

            document.getElementById("result-name").innerText = currentStudent;
            document.getElementById("result-grade").innerText = finalGrade.toFixed(1);

            // Guardar en Firebase
            const record = {
                name: currentStudent,
                grade: finalGrade,
                correct: correctAnswersCount,
                timestamp: Date.now()
            };

            database.ref("leaderboard").push(record)
                .then(() => loadLeaderboard())
                .catch(err => {
                    console.error("Error guardando datos:", err);
                    loadLeaderboard();
                });
        }

        function loadLeaderboard() {
            const tbody = document.getElementById("leaderboard-body");
            tbody.innerHTML = "";

            database.ref("leaderboard").once("value")
                .then(snapshot => {
                    let leaderboard = [];
                    snapshot.forEach(child => {
                        leaderboard.push(child.val());
                    });

                    // Ordenar por nota descendente y aciertos
                    leaderboard.sort((a, b) => b.grade - a.grade || b.correct - a.correct);

                    leaderboard.forEach((entry, idx) => {
                        const tr = document.createElement("tr");
                        if (entry.name === currentStudent && entry.grade === parseFloat((correctAnswersCount * 0.5).toFixed(1))) {
                            tr.className = "highlight-user";
                        }
                        tr.innerHTML = `
                            <td>${idx + 1}°</td>
                            <td>${entry.name}</td>
                            <td><b>${entry.grade.toFixed(1)}</b> / 5.0</td>
                            <td>${entry.correct} / 10</td>
                        `;
                        tbody.appendChild(tr);
                    });
                })
                .catch(e => {
                    tbody.innerHTML = `<tr><td colspan='4'>${currentStudent} - ${(correctAnswersCount * 0.5).toFixed(1)} / 5.0</td></tr>`;
                });
        }

        function restartActivity() {
            document.getElementById("app-user-name").value = "";
            document.getElementById("screen-results").classList.add("hidden");
            document.getElementById("screen-welcome").classList.remove("hidden");
        }
    </script>
</body>
</html>
