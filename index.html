<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taller de Acentuación Ortográfica</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg: #f8fafc;
            --card: #ffffff;
            --text: #1e293b;
            --border: #e2e8f0;
            --correct: #16a34a;
            --wrong: #dc2626;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background-color: var(--card);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 700px;
        }

        h1, h2, h3 {
            text-align: center;
            color: var(--primary);
            margin-bottom: 20px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
        }

        input[type="text"], select {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid var(--border);
            border-radius: 8px;
            font-size: 16px;
            margin-bottom: 15px;
        }

        input[type="text"]:focus, select:focus {
            outline: none;
            border-color: var(--primary);
        }

        button {
            width: 100%;
            padding: 12px 20px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        .header-game {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 2px solid var(--border);
            font-weight: 600;
        }

        .word-title {
            font-size: 28px;
            font-weight: 800;
            text-align: center;
            color: var(--primary);
            margin-bottom: 20px;
            letter-spacing: 2px;
        }

        .syllables-container {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        .syllable-btn {
            background-color: #f1f5f9;
            border: 2px solid var(--border);
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            width: auto;
            color: var(--text);
        }

        .syllable-btn.selected {
            background-color: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .form-section {
            background: #f8fafc;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid var(--border);
            margin-bottom: 20px;
        }

        .feedback {
            text-align: center;
            font-weight: bold;
            font-size: 18px;
            margin-bottom: 15px;
            min-height: 27px;
        }

        .feedback.correct { color: var(--correct); }
        .feedback.wrong { color: var(--wrong); }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th, td {
            padding: 10px;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }

        th {
            background-color: #f1f5f9;
            color: var(--primary);
        }

        .highlight-user {
            background-color: #e0e7ff;
            font-weight: bold;
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div class="container">
        <!-- PANTALLA INICIAL -->
        <div id="screen-welcome">
            <h1>Taller de Acentuación Ortográfica</h1>
            <p style="text-align: center; color: #64748b; margin-bottom: 20px;">
                Identifica la sílaba tónica y aplica las reglas de acentuación.
            </p>
            <div class="input-group">
                <label for="app-user-name">Nombre Completo del Estudiante:</label>
                <input type="text" id="app-user-name" placeholder="Ej. Juan Pérez" autocomplete="off">
            </div>
            <button onclick="startGame()">Comenzar Actividad</button>
        </div>

        <!-- PANTALLA DE PREGUNTAS -->
        <div id="screen-game" class="hidden">
            <div class="header-game">
                <span id="player-display"></span>
                <span>Palabra <span id="current-index">1</span> de 10</span>
            </div>

            <div class="word-title" id="word-target">PALABRA</div>

            <label style="text-align: center; margin-bottom: 10px;">1. Selecciona la sílaba tónica:</label>
            <div class="syllables-container" id="syllables-box"></div>

            <div class="form-section">
                <label for="select-tilde">2. ¿Lleva tilde (acento ortográfico)?</label>
                <select id="select-tilde" onchange="toggleVowelSelect()">
                    <option value="">-- Selecciona --</option>
                    <option value="SI">Sí lleva tilde</option>
                    <option value="NO">No lleva tilde</option>
                </select>

                <div id="vowel-container" class="hidden">
                    <label for="select-vowel">3. ¿En qué vocal recae la tilde?</label>
                    <select id="select-vowel">
                        <option value="">-- Selecciona la vocal --</option>
                        <option value="Á">Á</option>
                        <option value="É">É</option>
                        <option value="Í">Í</option>
                        <option value="Ó">Ó</option>
                        <option value="Ú">Ú</option>
                    </select>
                </div>
            </div>

            <div class="feedback" id="feedback-message"></div>
            <button id="btn-submit" onclick="checkAnswer()">Comprobar Respuesta</button>
            <button id="btn-next" class="hidden" onclick="nextQuestion()">Siguiente Palabra</button>
        </div>

        <!-- PANTALLA DE RESULTADOS -->
        <div id="screen-results" class="hidden">
            <h2>Resultados Finales</h2>
            <p style="text-align: center; font-size: 18px;">Estudiante: <b id="result-name"></b></p>
            <p style="text-align: center; font-size: 22px; font-weight: bold; color: var(--primary); margin: 15px 0;">
                Nota Final: <span id="result-grade">0.0</span> / 5.0
            </p>

            <h3>Tabla de Registro de Notas</h3>
            <table>
                <thead>
                    <tr>
                        <th>Pos.</th>
                        <th>Nombre</th>
                        <th>Nota</th>
                        <th>Aciertos</th>
                    </tr>
                </thead>
                <tbody id="leaderboard-body"></tbody>
            </table>
            <br>
            <button onclick="restartActivity()">Volver a Intentar</button>
        </div>
    </div>

    <!-- FIREBASE SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        // Configuración de Firebase
        const firebaseConfig = {
            databaseURL: "https://acento-ortografico-8ed2d-default-rtdb.firebaseio.com/"
        };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        // Banco de 90 palabras
        const wordBank = [
            { word: "CANCION", syllables: ["CAN", "CION"], tonic: 1, tilde: "SI", vowel: "Ó" },
            { word: "ARBOL", syllables: ["AR", "BOL"], tonic: 0, tilde: "SI", vowel: "Á" },
            { word: "CAMARA", syllables: ["CA", "MA", "RA"], tonic: 0, tilde: "SI", vowel: "Á" },
            { word: "DIGASELO", syllables: ["DI", "GA", "SE", "LO"], tonic: 0, tilde: "SI", vowel: "Í" },
            { word: "CAFE", syllables: ["CA", "FE"], tonic: 1, tilde: "SI", vowel: "É" },
            { word: "LAPIZ", syllables: ["LA", "PIZ"], tonic: 0, tilde: "SI", vowel: "Á" },
            { word: "MUSICA", syllables: ["MU", "SI", "CA"], tonic: 0, tilde: "SI", vowel: "Ú" },
            { word: "ENTREGASELO", syllables: ["EN", "TRE", "GA", "SE", "LO"], tonic: 1, tilde: "SI", vowel: "É" },
            { word: "CORAZON", syllables: ["CO", "RA", "ZON"], tonic: 2, tilde: "SI", vowel: "Ó" },
            { word: "MESA", syllables: ["ME", "SA"], tonic: 0, tilde: "NO", vowel: "" },
            { word: "CATEDRA", syllables: ["CA", "TE", "DRA"], tonic: 1, tilde: "SI", vowel: "É" },
            { word: "JARDIN", syllables: ["JAR", "DIN"], tonic: 1, tilde: "SI", vowel: "Í" },
            { word: "SITIO", syllables: ["SI", "TIO"], tonic: 0, tilde: "NO", vowel: "" },
            { word: "COMPUTADOR", syllables: ["COM", "PU", "TA", "DOR"], tonic: 3, tilde: "NO", vowel: "" },
            { word: "ANGEL", syllables: ["AN", "GEL"], tonic: 0, tilde: "SI", vowel: "Á" },
            { word: "PAGINA", syllables: ["PA", "GI", "NA"], tonic: 0, tilde: "SI", vowel: "Á" },
            { word: "LAGO", syllables: ["LA", "GO"], tonic: 0, tilde: "NO", vowel: "" },
            { word: "PERU", syllables: ["PE", "RU"], tonic: 1, tilde: "SI", vowel: "Ú" },
            { word: "CEPES", syllables: ["CE", "PES"], tonic: 0, tilde: "SI", vowel: "É" },
            { word: "EXAMEN", syllables: ["E", "XA", "MEN"], tonic: 1, tilde: "NO", vowel: "" },
            { word: "EXAMENES", syllables: ["E", "XA", "ME", "NES"], tonic: 1, tilde: "SI", vowel: "Á" },
            { word: "SOFA", syllables: ["SO", "FA"], tonic: 1, tilde: "SI", vowel: "Á" },
            { word: "FACIL", syllables: ["FA", "CIL"], tonic: 0, tilde: "SI", vowel: "Á" },
            { word: "LIBRO", syllables: ["LI", "BRO"], tonic: 0, tilde: "NO", vowel: "" },
            { word: "MEDICO", syllables: ["ME", "DI", "CO"], tonic: 0, tilde: "SI", vowel: "É" },
            { word: "PARED", syllables: ["PA", "RED"], tonic: 1, tilde: "NO", vowel: "" },
            { word: "RELICARIO", syllables: ["RE", "LI", "CA", "RIO"], tonic: 2, tilde: "NO", vowel: "" },
            { word: "TELEFONO", syllables: ["TE", "LE", "FO", "NO"], tonic: 1, tilde: "SI", vowel: "É" },
            { word: "CELULAR", syllables: ["CE", "LU", "LAR"], tonic: 2, tilde: "NO", vowel: "" },
            { word: "AZUCAR", syllables: ["A", "ZU", "CAR"], tonic: 1, tilde: "SI", vowel: "Ú" },
            { word: "PANTALON", syllables: ["PAN", "TA", "LON"], tonic: 2, tilde: "SI", vowel: "Ó" },
            { word: "MARMOL", syllables: ["MAR", "MOL"], tonic: 0, tilde: "SI", vowel: "Á" },
            { word: "GRAFICA", syllables: ["GRA", "FI", "CA"], tonic: 0, tilde: "SI", vowel: "Á" },
            { word: "PELOTA", syllables: ["PE", "LO", "TA"], tonic: 1, tilde: "NO", vowel: "" },
            { word: "RELOJ", syllables: ["RE", "LOJ"], tonic: 1, tilde: "NO", vowel: "" },
            { word: "LIDER", syllables: ["LI", "DER"], tonic: 0, tilde: "SI", vowel: "Í" },
            { word: "SEMANA", syllables: ["SE", "MA", "NA"], tonic: 1, tilde: "NO", vowel: "" },
            { word: "AMERICA", syllables: ["A", "ME", "RI", "CA"], tonic: 1, tilde: "SI", vowel: "É" },
            { word: "CUADERNO", syllables: ["CUA", "DER", "NO"], tonic: 1, tilde: "NO", vowel: "" },
            { word: "VOLCAN", syllables: ["VOL", "CAN"], tonic: 1, tilde: "SI", vowel: "Á" },
            { word: "DIFICIL", syllables: ["DI", "FI", "CIL"], tonic: 1, tilde: "SI", vowel: "Í" },
            { word: "NUMERO", syllables: ["NU", "ME", "RO"], tonic: 0, tilde: "SI", vowel: "Ú" },
            { word: "CAMION", syllables: ["CA", "MION"], tonic: 1, tilde: "SI", vowel: "Ó" },
            { word: "UTIL", syllables: ["U", "TIL"], tonic: 0, tilde: "SI", vowel: "Ú" },
            { word: "SABADO", syllables: ["SA", "BA", "DO"], tonic: 0, tilde: "SI", vowel: "Á" },
            { word: "VENTANA", syllables: ["VEN", "TA", "NA"], tonic: 1, tilde: "NO", vowel: "" },
            { word: "COMPAS", syllables: ["COM", "PAS"], tonic: 1, tilde: "SI", vowel: "Á" },
            { word: "CESPED", syllables: ["CES", "PED"], tonic: 0, tilde: "SI", vowel: "É" },
            { word: "BRUJULAS", syllables: ["BRU", "JU", "LAS"], tonic: 0, tilde: "SI", vowel: "Ú" },
            { word: "CEMENTO", syllables: ["CE", "MEN", "TO"], tonic: 1, tilde: "NO", vowel: "" },
            { word: "PAPA", syllables: ["PA", "PA"], tonic: 1, tilde: "SI", vowel: "Á" },
            { word: "CRATER", syllables: ["CRA", "TER"], tonic: 0, tilde: "SI", vowel: "Á" },
            { word: "SIMPATICO", syllables: ["SIM", "PA", "TI", "CO"], tonic: 1, tilde: "SI", vowel: "Á" },
            { word: "CAMINO", syllables: ["CA", "MI", "NO"], tonic: 1, tilde: "NO", vowel: "" },
            { word: "RUBI", syllables: ["RU", "BI"], tonic: 1, tilde: "SI", vowel: "Í" },
            { word: "CANIBAL", syllables: ["CA", "NI", "BAL"], tonic: 1, tilde: "SI", vowel: "Í" },
            { word: "TEATRO", syllables: ["TE", "A", "TRO"], tonic: 1, tilde: "NO", vowel: "" },
            { word: "RABANO", syllables: ["RA", "BA", "NO"], tonic: 0, tilde: "SI", vowel: "Á" },
            { word: "JAMON", syllables: ["JA", "MON"], tonic: 1, tilde: "SI", vowel: "Ó" },
            { word: "CADAVER", syllables: ["CA", "DA", "VER"], tonic: 1, tilde: "SI", vowel: "Á" },
            { word: "QUIMICA", syllables: ["QUI", "MI", "CA"], tonic: 0, tilde: "SI", vowel: "Í" },
            { word: "AMISTAD", syllables: ["A", "MIS", "TAD"], tonic: 2, tilde: "NO", vowel: "" },
            { word: "MANI", syllables: ["MA", "NI"], tonic: 1, tilde: "SI", vowel: "Í" },
            { word: "CONDOR", syllables: ["CON", "DOR"], tonic: 0, tilde: "SI", vowel: "Ó" },
            { word: "PLASTICO", syllables: ["PLAS", "TI", "CO"], tonic: 0, tilde: "SI", vowel: "Á" },
            { word: "CIUDAD", syllables: ["CIU", "DAD"], tonic: 1, tilde: "NO", vowel: "" },
            { word: "BAMBU", syllables: ["BAM", "BU"], tonic: 1, tilde: "SI", vowel: "Ú" },
            { word: "ALBUM", syllables: ["AL", "BUM"], tonic: 0, tilde: "SI", vowel: "Á" },
            { word: "LAMPARA", syllables: ["LAM", "PA", "RA"], tonic: 0, tilde: "SI", vowel: "Á" },
            { word: "MUSEO", syllables: ["MU", "SEO"], tonic: 1, tilde: "NO", vowel: "" },
            { word: "JAPONES", syllables: ["JA", "PO", "NES"], tonic: 2, tilde: "SI", vowel: "É" },
            { word: "TREBOL", syllables: ["TRE", "BOL"], tonic: 0, tilde: "SI", vowel: "É" },
            { word: "TITULO", syllables: ["TI", "TU", "LO"], tonic: 0, tilde: "SI", vowel: "Í" },
            { word: "ZAPATO", syllables: ["ZA", "PA", "TO"], tonic: 1, tilde: "NO", vowel: "" },
            { word: "LEON", syllables: ["LE", "ON"], tonic: 1, tilde: "SI", vowel: "Ó" },
            { word: "TUNEL", syllables: ["TU", "NEL"], tonic: 0, tilde: "SI", vowel: "Ú" },
            { word: "CANTARO", syllables: ["CAN", "TA", "RO"], tonic: 0, tilde: "SI", vowel: "Á" },
            { word: "ESCUELA", syllables: ["ES", "CUE", "LA"], tonic: 1, tilde: "NO", vowel: "" },
            { word: "ANIS", syllables: ["A", "NIS"], tonic: 1, tilde: "SI", vowel: "Í" },
            { word: "UTIL", syllables: ["U", "TIL"], tonic: 0, tilde: "SI", vowel: "Ú" },
            { word: "PROXIMO", syllables: ["PRO", "XI", "MO"], tonic: 0, tilde: "SI", vowel: "Ó" },
            { word: "PERSONA", syllables: ["PER", "SO", "NA"], tonic: 1, tilde: "NO", vowel: "" },
            { word: "BALCON", syllables: ["BAL", "CON"], tonic: 1, tilde: "SI", vowel: "Ó" },
            { word: "BENEFICO", syllables: ["BE", "NE", "FI", "CO"], tonic: 2, tilde: "SI", vowel: "Í" },
            { word: "SARTEN", syllables: ["SAR", "TEN"], tonic: 1, tilde: "SI", vowel: "É" },
            { word: "TORTUGA", syllables: ["TOR", "TU", "GA"], tonic: 1, tilde: "NO", vowel: "" },
            { word: "INGLES", syllables: ["IN", "GLES"], tonic: 1, tilde: "SI", vowel: "É" },
            { word: "CARACTER", syllables: ["CA", "RAC", "TER"], tonic: 1, tilde: "SI", vowel: "Á" },
            { word: "LIMA", syllables: ["LI", "MA"], tonic: 0, tilde: "NO", vowel: "" },
            { word: "RATON", syllables: ["RA", "TON"], tonic: 1, tilde: "SI", vowel: "Ó" }
        ];

        let currentStudent = "";
        let currentWordIndex = 0;
        let correctAnswersCount = 0;
        let selectedWords = [];
        let selectedSyllableIndex = null;

        function startGame() {
            const nameInput = document.getElementById("app-user-name").value.trim();
            if (!nameInput) {
                alert("Por favor, ingresa tu nombre completo.");
                return;
            }
            currentStudent = nameInput;
            document.getElementById("player-display").innerText = currentStudent;

            // Seleccionar 10 palabras al azar de las 90
            selectedWords = [...wordBank].sort(() => 0.5 - Math.random()).slice(0, 10);
            currentWordIndex = 0;
            correctAnswersCount = 0;

            document.getElementById("screen-welcome").classList.add("hidden");
            document.getElementById("screen-game").classList.remove("hidden");
            document.getElementById("screen-results").classList.add("hidden");

            showWord();
        }

        function showWord() {
            selectedSyllableIndex = null;
            document.getElementById("feedback-message").innerText = "";
            document.getElementById("feedback-message").className = "feedback";
            document.getElementById("select-tilde").value = "";
            document.getElementById("select-vowel").value = "";
            document.getElementById("vowel-container").classList.add("hidden");
            document.getElementById("btn-submit").classList.remove("hidden");
            document.getElementById("btn-next").classList.add("hidden");

            const current = selectedWords[currentWordIndex];
            document.getElementById("current-index").innerText = currentWordIndex + 1;
            document.getElementById("word-target").innerText = current.word;

            // Generar botones de sílabas
            const box = document.getElementById("syllables-box");
            box.innerHTML = "";
            current.syllables.forEach((syl, idx) => {
                const btn = document.createElement("button");
                btn.type = "button";
                btn.className = "syllable-btn";
                btn.innerText = syl;
                btn.onclick = () => selectSyllable(idx, btn);
                box.appendChild(btn);
            });
        }

        function selectSyllable(index, btnEl) {
            selectedSyllableIndex = index;
            document.querySelectorAll(".syllable-btn").forEach(b => b.classList.remove("selected"));
            btnEl.classList.add("selected");
        }

        function toggleVowelSelect() {
            const val = document.getElementById("select-tilde").value;
            if (val === "SI") {
                document.getElementById("vowel-container").classList.remove("hidden");
            } else {
                document.getElementById("vowel-container").classList.add("hidden");
                document.getElementById("select-vowel").value = "";
            }
        }

        function checkAnswer() {
            if (selectedSyllableIndex === null) {
                alert("Debes seleccionar la sílaba tónica.");
                return;
            }

            const tildeChoice = document.getElementById("select-tilde").value;
            if (!tildeChoice) {
                alert("Debes seleccionar si lleva tilde o no.");
                return;
            }

            const vowelChoice = document.getElementById("select-vowel").value;
            if (tildeChoice === "SI" && !vowelChoice) {
                alert("Debes indicar en qué vocal recae la tilde.");
                return;
            }

            const current = selectedWords[currentWordIndex];
            const isTonicCorrect = selectedSyllableIndex === current.tonic;
            const isTildeCorrect = tildeChoice === current.tilde;
            const isVowelCorrect = current.tilde === "NO" || vowelChoice === current.vowel;

            const feedbackEl = document.getElementById("feedback-message");

            if (isTonicCorrect && isTildeCorrect && isVowelCorrect) {
                correctAnswersCount++;
                feedbackEl.innerText = "¡Excelente! Respuesta Correcta.";
                feedbackEl.className = "feedback correct";
            } else {
                let msg = `Incorrecto. `;
                if (current.tilde === "SI") {
                    msg += `Lleva tilde en la vocal ${current.vowel}.`;
                } else {
                    msg += `No lleva tilde.`;
                }
                feedbackEl.innerText = msg;
                feedbackEl.className = "feedback wrong";
            }

            document.getElementById("btn-submit").classList.add("hidden");
            document.getElementById("btn-next").classList.remove("hidden");
        }

        function nextQuestion() {
            currentWordIndex++;
            if (currentWordIndex < selectedWords.length) {
                showWord();
            } else {
                finishGame();
            }
        }

        function finishGame() {
            const finalGrade = parseFloat((correctAnswersCount * 0.5).toFixed(1));

            document.getElementById("screen-game").classList.add("hidden");
            document.getElementById("screen-results").classList.remove("hidden");

            document.getElementById("result-name").innerText = currentStudent;
            document.getElementById("result-grade").innerText = finalGrade.toFixed(1);

            // Enviar nota a Firebase Realtime Database
            const record = {
                name: currentStudent,
                grade: finalGrade,
                correct: correctAnswersCount,
                timestamp: Date.now()
            };

            database.ref("leaderboard").push(record)
                .then(() => loadLeaderboard())
                .catch(err => {
                    console.error("Error guardando datos:", err);
                    loadLeaderboard();
                });
        }

        function loadLeaderboard() {
            const tbody = document.getElementById("leaderboard-body");
            tbody.innerHTML = "";

            database.ref("leaderboard").once("value")
                .then(snapshot => {
                    let leaderboard = [];
                    snapshot.forEach(child => {
                        leaderboard.push(child.val());
                    });

                    // Ordenar de mayor a menor nota
                    leaderboard.sort((a, b) => b.grade - a.grade || b.correct - a.correct);

                    leaderboard.forEach((entry, idx) => {
                        const tr = document.createElement("tr");
                        if (entry.name === currentStudent && entry.grade === parseFloat((correctAnswersCount * 0.5).toFixed(1))) {
                            tr.className = "highlight-user";
                        }
                        tr.innerHTML = `
                            <td>${idx + 1}°</td>
                            <td>${entry.name}</td>
                            <td><b>${entry.grade.toFixed(1)}</b> / 5.0</td>
                            <td>${entry.correct} / 10</td>
                        `;
                        tbody.appendChild(tr);
                    });
                })
                .catch(e => {
                    tbody.innerHTML = `<tr><td colspan='4'>${currentStudent} - ${(correctAnswersCount * 0.5).toFixed(1)} / 5.0</td></tr>`;
                });
        }

        function restartActivity() {
            document.getElementById("app-user-name").value = "";
            document.getElementById("screen-results").classList.add("hidden");
            document.getElementById("screen-welcome").classList.remove("hidden");
        }
    </script>
</body>
</html>
