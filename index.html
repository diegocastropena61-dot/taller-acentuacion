<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acento Ortográfico - Modo Acentúa</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #121212;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }
    .card {
      background-color: #1e1e1e;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
      text-align: center;
      max-width: 500px;
      width: 100%;
    }
    h1 { color: #4CAF50; margin-bottom: 10px; }
    p { font-size: 1.1em; }
    .syllable-container {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin: 20px 0;
    }
    .syllable-btn, .option-btn {
      background-color: #333;
      color: #fff;
      border: 2px solid #555;
      padding: 12px 20px;
      font-size: 1.2em;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.2s, border-color 0.2s;
    }
    .syllable-btn:hover, .option-btn:hover {
      background-color: #444;
      border-color: #4CAF50;
    }
    .feedback {
      margin-top: 15px;
      font-weight: bold;
      min-height: 24px;
    }
    .score {
      font-size: 1.2em;
      color: #FFC107;
      margin-top: 15px;
    }
    .next-btn {
      background-color: #4CAF50;
      color: white;
      border: none;
      padding: 10px 20px;
      font-size: 1em;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 15px;
      display: none;
    }
  </style>
</head>
<body>

<div class="card">
  <h1>Modo Acentúa</h1>
  <p id="instruction">Toca la sílaba tónica (la que suena más fuerte):</p>
  
  <div class="syllable-container" id="syllables"></div>

  <div id="step2" style="display:none;">
    <p id="rule-question"></p>
    <div>
      <button class="option-btn" onclick="checkAccent(true)">Sí lleva tilde</button>
      <button class="option-btn" onclick="checkAccent(false)">No lleva tilde</button>
    </div>
  </div>

  <div class="feedback" id="feedback"></div>
  <button class="next-btn" id="next-btn" onclick="nextWord()">Siguiente palabra</button>
  <div class="score">Puntos: <span id="score">0</span></div>
</div>

<script>
  const words = [
    { text: ["ga", "to"], tonicIndex: 0, type: "Grave", accent: false, rule: "es Grave y termina en Vocal" },
    { text: ["li", "món"], tonicIndex: 1, type: "Aguda", accent: true, rule: "es Aguda y termina en N" },
    { text: ["Ca", "mión"], tonicIndex: 1, type: "Aguda", accent: true, rule: "es Aguda y termina en N" },
    { text: ["ár", "bol"], tonicIndex: 0, type: "Grave", accent: true, rule: "es Grave y NO termina en N, S o Vocal" },
    { text: ["mé", "di", "co"], tonicIndex: 0, type: "Esdrújula", accent: true, rule: "es Esdrújula (todas llevan tilde)" },
    { text: ["lá", "piz"], tonicIndex: 0, type: "Grave", accent: true, rule: "es Grave y NO termina en N, S o Vocal" }
  ];

  let currentWordIndex = 0;
  let score = 0;

  function loadWord() {
    const word = words[currentWordIndex];
    const container = document.getElementById("syllables");
    container.innerHTML = "";
    document.getElementById("step2").style.display = "none";
    document.getElementById("feedback").innerText = "";
    document.getElementById("next-btn").style.display = "none";
    document.getElementById("instruction").innerText = "Toca la sílaba tónica (la que suena más fuerte):";

    word.text.forEach((syllable, index) => {
      const btn = document.createElement("button");
      btn.className = "syllable-btn";
      btn.innerText = syllable;
      btn.onclick = () => selectTonic(index);
      container.appendChild(btn);
    });
  }

  function selectTonic(index) {
    const word = words[currentWordIndex];
    if (index === word.tonicIndex) {
      document.getElementById("feedback").innerText = `¡Correcto! Es una palabra ${word.type}.`;
      document.getElementById("feedback").style.color = "#4CAF50";
      document.getElementById("step2").style.display = "block";
      document.getElementById("rule-question").innerText = `¿Lleva tilde según las reglas del cuadro?`;
    } else {
      document.getElementById("feedback").innerText = "Inténtalo de nuevo. Esa no es la sílaba tónica.";
      document.getElementById("feedback").style.color = "#F44336";
    }
  }

  function checkAccent(userChoice) {
    const word = words[currentWordIndex];
    if (userChoice === word.accent) {
      score += 10;
      document.getElementById("score").innerText = score;
      document.getElementById("feedback").innerText = `¡Excelente! No/Lleva tilde porque ${word.rule}.`;
      document.getElementById("feedback").style.color = "#4CAF50";
      document.getElementById("next-btn").style.display = "inline-block";
      document.getElementById("step2").style.display = "none";
    } else {
      document.getElementById("feedback").innerText = `Incorrecto. Recuerda que ${word.rule}.`;
      document.getElementById("feedback").style.color = "#F44336";
    }
  }

  function nextWord() {
    currentWordIndex = (currentWordIndex + 1) % words.length;
    loadWord();
  }

  loadWord();
</script>

</body>
</html>
