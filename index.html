<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taller de Acentuación Ortográfica</title>
    <style>
        :root {
            --primary: #2c3e50;
            --accent: #27ae60;
            --secondary: #2980b9;
            --bg: #f4f6f7;
            --card-bg: #ffffff;
            --text: #333333;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background: var(--card-bg);
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .screen {
            display: none;
        }

        .screen.active {
            display: block;
        }

        h1, h2 {
            color: var(--primary);
            text-align: center;
        }

        .description {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        .input-group {
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        input[type="text"] {
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.2s;
        }

        .btn-green {
            background-color: var(--accent);
            color: white;
        }

        .btn-green:hover {
            background-color: #219150;
        }

        .btn-secondary {
            background-color: #95a5a6;
            color: white;
        }

        .btn-secondary:hover {
            background-color: #7f8c8d;
        }

        .header-game {
            display: flex;
            justify-content: space-between;
            padding: 10px;
            background: #ecf0f1;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 14px;
        }

        /* Tabla SEGA de 5 columnas */
        .sega-table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
        }

        .sega-table th, .sega-table td {
            border: 1px solid #bdc3c7;
            padding: 12px;
            text-align: center;
        }

        .sega-table th {
            background-color: var(--primary);
            color: white;
        }

        .sega-table td {
            height: 40px;
        }

        .options-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 15px;
        }

        .leaderboard-list {
            list-style: none;
            padding: 0;
        }

        .leaderboard-item {
            display: flex;
            justify-content: space-between;
            padding: 10px;
            border-bottom: 1px solid #eee;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- PANTALLA INICIAL -->
    <div id="screen-welcome" class="screen active">
        <h1>Taller de Acentuación Ortográfica</h1>
        <p class="description">Evaluación de acentuación y clasificación de palabras.</p>
        
        <div class="input-group">
            <label for="user-name">Nombre Completo del Estudiante:</label>
            <input type="text" id="user-name" placeholder="Ej. Diego Castro" autocomplete="off">
        </div>

        <button class="btn-green" onclick="startGame()">Comenzar Evaluación</button>
        <button class="btn-secondary" onclick="showLeaderboardView()">Ver Tabla de Posiciones General</button>
    </div>

    <!-- PANTALLA DEL EXAMEN -->
    <div id="screen-game" class="screen">
        <div class="header-game">
            <span>Estudiante: <b id="player-display"></b></span>
            <span>Palabra: <b id="current-index">1</b> / 10</span>
            <span>Aciertos: <b id="score-display">0</b></span>
        </div>

        <h2 id="word-display" style="text-align: center; letter-spacing: 2px;">---</h2>

        <!-- Estructura de la Tabla SEGA (5 columnas) -->
        <table class="sega-table">
            <thead>
                <tr>
                    <th>Anterior</th>
                    <th>Sobresdrújula</th>
                    <th>Esdrújula</th>
                    <th>Grave</th>
                    <th>Aguda</th>
                </tr>
            </thead>
            <tbody>
                <tr id="syllables-row">
                    <td>-</td>
                    <td>-</td>
                    <td>-</td>
                    <td>-</td>
                    <td>-</td>
                </tr>
            </tbody>
        </table>

        <div class="options-group" id="action-buttons">
            <!-- Botones de clasificación/respuesta generados dinámicamente -->
        </div>
    </div>

    <!-- PANTALLA DE RESULTADOS / TABLA DE POSICIONES -->
    <div id="screen-leaderboard" class="screen">
        <h2>Tabla de Posiciones General</h2>
        <ul id="leaderboard-container" class="leaderboard-list">
            <!-- Cargado dinámicamente desde Firebase/localStorage -->
        </ul>
        <button class="btn-secondary" onclick="showWelcomeScreen()">Volver al Inicio</button>
    </div>
</div>

    // Variables de Estado
    let currentUser = "";
    let score = 0;
    let currentQuestion = 0;
    let selectedQuestions = [];

    // Funciones Principales
    function startGame() {
        const nameInput = document.getElementById("user-name").value.trim();
        if (!nameInput) {
            alert("Por favor ingresa tu nombre completo antes de comenzar.");
            return;
        }

        currentUser = nameInput;
        score = 0;
        currentQuestion = 0;
        
        // Seleccionar 10 palabras aleatorias del banco
        selectedQuestions = [...wordBank].sort(() => 0.5 - Math.random()).slice(0, 10);

        document.getElementById("player-display").textContent = currentUser;
        document.getElementById("score-display").textContent = score;

        switchScreen("screen-game");
        loadQuestion();
    }

    function loadQuestion() {
        if (currentQuestion >= selectedQuestions.length) {
            finishGame();
            return;
        }

        const q = selectedQuestions[currentQuestion];
        document.getElementById("current-index").textContent = currentQuestion + 1;
        document.getElementById("word-display").textContent = q.syllables.join("");

        // Renderizar sílabas en la tabla SEGA de 5 columnas
        const row = document.getElementById("syllables-row");
        const cells = ["", "", "", "", ""];
        
        // Colocar sílabas comenzando desde la derecha (Aguda = índice 4)
        for (let i = 0; i < q.syllables.length; i++) {
            const pos = 4 - i;
            if (pos >= 0) {
                cells[pos] = q.syllables[q.syllables.length - 1 - i];
            }
        }

        row.innerHTML = cells.map(c => `<td>${c || "-"}</td>`).join("");

        // Generar botones de clasificación
        const actions = document.getElementById("action-buttons");
        actions.innerHTML = `
            <button class="btn-green" onclick="answer('Sobresdrújula')">Sobresdrújula</button>
            <button class="btn-green" onclick="answer('Esdrújula')">Esdrújula</button>
            <button class="btn-green" onclick="answer('Grave')">Grave</button>
            <button class="btn-green" onclick="answer('Aguda')">Aguda</button>
        `;
    }

    function answer(categorySelected) {
        const q = selectedQuestions[currentQuestion];
        if (categorySelected === q.category) {
            score += 10;
            document.getElementById("score-display").textContent = score;
        }
        
        currentQuestion++;
        loadQuestion();
    }

    function finishGame() {
        alert(`¡Evaluación finalizada! Tu puntaje es: ${score}/100`);
        
        // Guardar resultado en Firebase o localStorage
        if (database) {
            database.ref('posiciones').push({
                nombre: currentUser,
                puntaje: score,
                fecha: new Date().toLocaleDateString()
            });
        } else {
            let localScores = JSON.parse(localStorage.getItem("scores") || "[]");
            localScores.push({ nombre: currentUser, puntaje: score });
            localStorage.setItem("scores", JSON.stringify(localScores));
        }

        showLeaderboardView();
    }

    function showLeaderboardView() {
        switchScreen("screen-leaderboard");
        const container = document.getElementById("leaderboard-container");
        container.innerHTML = "<li>Cargando...</li>";

        if (database) {
            database.ref('posiciones').orderByChild('puntaje').limitToLast(10).once('value', (snapshot) => {
                container.innerHTML = "";
                let items = [];
                snapshot.forEach(child => {
                    items.unshift(child.val());
                });
                renderScores(items);
            });
        } else {
            let localScores = JSON.parse(localStorage.getItem("scores") || "[]");
            localScores.sort((a,b) => b.puntaje - a.puntaje);
            renderScores(localScores);
        }
    }

    function renderScores(items) {
        const container = document.getElementById("leaderboard-container");
        if (items.length === 0) {
            container.innerHTML = "<li>No hay puntajes registrados aún.</li>";
            return;
        }
        container.innerHTML = items.map(item => `
            <li class="leaderboard-item">
                <span><b>${item.nombre}</b></span>
                <span>${item.puntaje} pts</span>
            </li>
        `).join("");
    }

    function switchScreen(screenId) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(screenId).classList.add('active');
    }

    function showWelcomeScreen() {
        switchScreen("screen-welcome");
    }
</script>

</body>
</html>
